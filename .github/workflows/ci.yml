name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sbcl:
    name: Build e test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl
      - name: Versione
        run: sbcl --version
      - name: Build senza avvisi e test
        run: make test
      - name: Linter e auto-verifica del linter
        run: make lint lint-selftest
      - name: Esperimenti Fase 0 (correttezza, senza benchmark)
        run: make spikes-check

  docs:
    name: Tracciabilità e documentazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Tracciabilità
        run: make trace
      - name: Link e ancore
        run: make links
