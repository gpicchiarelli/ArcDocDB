name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sbcl:
    name: Build e test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sbcl
      - name: Verifica completa registrata (senza benchmark)
        run: make check
      - name: Conserva prove e diagnostiche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-${{ matrix.os }}
          path: spikes/out/
          if-no-files-found: error

  docs:
    name: Tracciabilità e documentazione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sbcl
      - name: Tracciabilità e link registrati
        run: sbcl --noinform --no-userinit --no-sysinit --script tools/record-command.lisp -- make trace links
      - name: Conserva prove e diagnostiche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove-documentazione
          path: spikes/out/
          if-no-files-found: error
