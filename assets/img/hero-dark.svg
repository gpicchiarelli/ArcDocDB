<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">The segments of a Serie</title>
  <desc id="d">A stack of horizontal bars. The top one, ACTIVE, is the only one in colour and is partly filled: it is the only segment that changes. Below it, closed segments are solid and immutable; two short ones are what CLEAN left; a dashed outline is an obsolete segment waiting for its last reader.</desc>
  <defs>
    <clipPath id="a"><rect x="56" y="58" width="380" height="14" rx="7.0"/></clipPath>
    <filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <path d="M56 40A831.5 831.5 0 0 1 436 40" stroke="#48484a" stroke-width="1" fill="none" stroke-linecap="round"/>
  <rect x="70" y="60" width="192.39999999999998" height="10" rx="7.0" fill="#e9a84c" opacity=".45" filter="url(#g)"/>
  <rect x="56" y="58" width="220.39999999999998" height="14" fill="#e9a84c" clip-path="url(#a)"/>
  <rect x="56" y="58" width="380" height="14" rx="7.0" fill="none" stroke="#e9a84c" stroke-width="1.25"/>
  <rect x="56" y="88" width="380" height="14" rx="7.0" fill="#f5f5f7"/>
  <rect x="56" y="118" width="380" height="14" rx="7.0" fill="#f5f5f7"/>
  <rect x="56" y="148" width="380" height="14" rx="7.0" fill="#f5f5f7"/>
  <rect x="56" y="178" width="66" height="14" rx="7.0" fill="#f5f5f7"/>
  <rect x="56" y="208" width="106" height="14" rx="7.0" fill="#f5f5f7"/>
  <rect x="56" y="238" width="380" height="14" rx="7.0" fill="none" stroke="#48484a" stroke-width="1.25" stroke-dasharray="1.5 5" stroke-linecap="round"/>
  <path d="M448 95.0H453V155.0H448" stroke="#48484a" stroke-width="1" fill="none"/>
  <path d="M448 185.0H453V215.0H448" stroke="#48484a" stroke-width="1" fill="none"/>
  <text x="474" y="68.5" font-size="10" font-weight="600" letter-spacing="1.5" fill="#f5f5f7">ACTIVE</text><text x="566" y="69.5" font-size="13" fill="#a1a1a6">the only segment that changes</text>
  <text x="474" y="128.5" font-size="10" font-weight="600" letter-spacing="1.5" fill="#f5f5f7">CLOSED</text><text x="566" y="129.5" font-size="13" fill="#a1a1a6">immutable, forever</text>
  <text x="474" y="203.5" font-size="10" font-weight="600" letter-spacing="1.5" fill="#f5f5f7">CLEAN</text><text x="566" y="204.5" font-size="13" fill="#a1a1a6">what survives is copied, never refilled</text>
  <text x="474" y="248.5" font-size="10" font-weight="600" letter-spacing="1.5" fill="#f5f5f7">OBSOLETE</text><text x="566" y="249.5" font-size="13" fill="#a1a1a6">readable until the last reader leaves</text>
</svg>
