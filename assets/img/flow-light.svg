  <rect x="484.0" y="150" width="150" height="38" rx="19.0" stroke="#d2d2d7" stroke-width="1.25" fill="none"/><text x="559.0" y="174.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">verify</text>
  <path d="M641.0 169.0H671.0M665.5 165.0L671.0 169.0L665.5 173.0" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="684.0" y="174.0" font-size="14" font-weight="600" fill="#1d1d1f">reply</text>
  <text x="171.0" y="207" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">IN MEMORY · NO LOCK</text>
  <text x="365.0" y="207" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">BY LOCATION</text>
  <text x="559.0" y="207" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">CRC32C · EVERY READ</text>
</svg>
