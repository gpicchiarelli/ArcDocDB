  <path d="M253.0 59.0H283.0M277.5 55.0L283.0 59.0L277.5 63.0" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290.0" y="40" width="150" height="38" rx="19.0" stroke="#c9892f" stroke-width="1.25" fill="none"/><text x="365.0" y="64.0" text-anchor="middle" font-size="14" font-weight="500" fill="#c9892f">ACTIVE</text>
  <path d="M447.0 59.0H477.0M471.5 55.0L477.0 59.0L471.5 63.0" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="484.0" y="40" width="150" height="38" rx="19.0" stroke="#d2d2d7" stroke-width="1.25" fill="none"/><text x="559.0" y="64.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">CLOSED</text>
  <path d="M641.0 59.0H671.0M665.5 55.0L671.0 59.0L665.5 63.0" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="678.0" y="40" width="150" height="38" rx="19.0" stroke="#d2d2d7" stroke-width="1.25" fill="none"/><text x="753.0" y="64.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">CLEAN · MERGE</text>
  <text x="171.0" y="28" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">ONE PER SERIE</text>
  <text x="365.0" y="28" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">APPEND ONLY</text>
  <text x="559.0" y="28" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">IMMUTABLE</text>
  <text x="753.0" y="28" text-anchor="middle" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">COPY-ON-WRITE</text>
  <path d="M171.0 85V143M167.0 137.5L171.0 143L175.0 137.5" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="182.0" y="117.5" text-anchor="start" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">PUBLISH</text>
  <path d="M365.0 85V143M361.0 137.5L365.0 143L369.0 137.5" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="376.0" y="117.5" text-anchor="start" font-size="9.5" font-weight="600" letter-spacing="1.2" fill="#6e6e73">ON MISS</text>
  <rect x="96.0" y="150" width="150" height="38" rx="19.0" stroke="#d2d2d7" stroke-width="1.25" fill="none"/><text x="171.0" y="174.0" text-anchor="middle" font-size="14" font-weight="500" fill="#1d1d1f">primary index</text>
  <path d="M253.0 169.0H283.0M277.5 165.0L283.0 169.0L277.5 173.0" stroke="#6e6e73" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
