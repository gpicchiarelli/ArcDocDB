<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 228" width="880" height="228" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">How a write and a read travel through a Serie</title>
  <desc id="d">A write reaches the single writer of the Serie and is appended to the ACTIVE segment, which later becomes an immutable CLOSED segment that CLEAN and MERGE copy but never modify. The writer publishes the new location to the in-memory primary index. A read takes no lock: it probes the primary index, then the cache keyed by location, falling back to the segment on a miss; every record is verified with CRC32C before the reply.</desc>
  <text x="60" y="64.0" text-anchor="end" font-size="14" font-weight="600" fill="#1d1d1f">write</text>
  <text x="60" y="174.0" text-anchor="end" font-size="14" font-weight="600" fill="#1d1d1f">read</text>
